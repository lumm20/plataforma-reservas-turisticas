<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Experiencia</title>
</head>
<body>

    <h1>Registrar nueva experiencia</h1>

    <form id="expForm">
        <label>Nombre:</label>
        <input type="text" id="name" required><br><br>

        <label>Descripción:</label>
        <textarea id="description" required></textarea><br><br>

        <label>Precio:</label>
        <input type="number" id="price" required><br><br>

        <label>Cupo disponible:</label>
        <input type="number" id="cupo_disponible" required><br><br>

        <label>Duración:</label>
        <input type="text" id="duration" required><br><br>

        <label>Categoría:</label>
        <input type="text" id="category" required><br><br>

        <label>Proveedor:</label>
        <input type="text" id="provider_name" required><br><br>

        <button type="submit">Guardar experiencia</button>
    </form>

    <p id="msg"></p>

    <script src="add_experience.js"></script>

</body>
</html>
