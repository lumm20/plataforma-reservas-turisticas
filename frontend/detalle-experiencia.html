<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Experiencia</title>

    <!-- Fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="detalle-experiencia.js" defer></script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            margin: 8px 0;
            color: #555;
            font-size: 15px;
        }

        strong {
            color: #222;
        }

        #btnReserva {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        #btnReserva:hover {
            background: #005fcc;
        }

        #btnReserva:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
            font-size: 14px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

    <div class="card">

        <h1 id="expName">Cargando...</h1>

        <p id="expDescription"></p>

        <p><strong>Precio:</strong> $<span id="expPrice"></span></p>

        <p><strong>Cupo disponible:</strong> <span id="expCupo"></span></p>

        <p><strong>Duración:</strong> <span id="expDuration"></span></p>

        <p><strong>Categoría:</strong> <span id="expCategory"></span></p>

        <p><strong>Proveedor:</strong> <span id="expProvider"></span></p>

        <button id="btnReserva">Reservar Ahora</button>

        <a href="index.html" class="back-btn">← Volver al inicio</a>

    </div>

</body>
</html>
